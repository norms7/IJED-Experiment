services:
  - type: web
    name: IJED-HCJ-1
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    # PERF FIX: added --workers 2 so two event loops handle requests concurrently.
    # Free tier has 512MB RAM; 2 uvicorn workers ≈ ~150-200MB total — within limits.
    # If you ever upgrade to a paid Render plan, you can safely raise this to 4.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard — never commit real credentials
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://ijedlms.vercel.app http://localhost:5500 http://127.0.0.1:5500 http://localhost:5501 http://127.0.0.1:5501"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
